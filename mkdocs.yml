# Generated by scripts/build_site.py — do not edit by hand.
site_name: Rust (Facepunch) Game Knowledge Base
site_description: Evidence-based, source-cited reference for the PC/Steam survival game Rust — mechanics, items, building and raiding, server administration, modding and updates.
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
nav:
  - Home: index.md
  - "Tier 1 — Category foundations":
      - "Rust Building and Raiding: Foundation": building-raiding/rust-building-raiding-foundation.md
      - "Rust Game Mechanics: Foundation": game-mechanics/rust-game-mechanics-foundation.md
      - "Rust Items and Crafting: Foundation": items-crafting/rust-items-crafting-foundation.md
      - "Rust Modding and Plugins: Foundation": modding-plugins/rust-modding-plugins-foundation.md
      - "Rust Server Administration: Foundation": server-administration/rust-server-administration-foundation.md
      - "Rust Updates and Meta: Foundation": updates-meta/rust-updates-meta-foundation.md
